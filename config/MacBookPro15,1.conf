# SmartFan: датчики и пороги для MacBookPro15,1 (MacBook Pro 15", 2018–2019)
#
# Формат: КЛЮЧ  СТАРТ  МАКСИМУМ  описание
#   СТАРТ    — при этой температуре датчик начинает раскручивать вентиляторы
#   МАКСИМУМ — при этой температуре он требует полные обороты
# Вентиляторы крутятся так, как требует самый «опасный» датчик
# (у кого температура ближе всего к его собственному максимуму).
# После правки перезапусти службу:
#   sudo launchctl kickstart -k system/local.smartfan

# Процессор (предел кристалла 100°C; ядра скачут, служба сглаживает)
TCXC  68  92  CPU PECI, самое горячее ядро
TCMX  68  92  CPU максимум
TC0E  68  92  CPU кристалл
TC0F  68  92  CPU кристалл (фильтр)
TC1C  68  92  ядро 1
TC2C  68  92  ядро 2
TC3C  68  92  ядро 3
TC4C  68  92  ядро 4
TC5C  68  92  ядро 5
TC6C  68  92  ядро 6
TCGC  68  92  встроенная графика Intel
TCSA  68  92  System Agent процессора
TC0P  58  82  рядом с процессором

# Видеокарта Radeon Pro 555X
TGDD  68  92  кристалл GPU
TGDF  68  92  кристалл GPU (фильтр)
TG0P  58  82  рядом с GPU
TGVP  62  85  питание GPU

# Плата, память, чипсет, Wi-Fi
TPCD  62  85  чипсет (PCH)
TM0P  58  80  рядом с памятью
Tm0P  60  82  плата
TW0P  55  75  Wi-Fi модуль

# SSD (сбрасывает скорость примерно с 70°C)
TH0F  50  68  SSD
TH0X  50  68  SSD
TH0a  50  68  SSD NAND
TH0b  50  68  SSD NAND

# Thunderbolt-контроллеры (греются при зарядке слева)
TTLD  52  75  Thunderbolt слева
TTRD  52  75  Thunderbolt справа

# Радиатор и тепловые трубки
Th1H  60  80  радиатор 1
Th2H  60  80  радиатор 2

# Воздух на выдуве
TaLC  45  62  поток слева
TaRC  45  62  поток справа

# Батарея (лучше держать ниже 45°C)
TB0T  38  47  батарея
TB1T  38  47  батарея 1
TB2T  38  47  батарея 2

# Корпус и подставка под ладони (комфорт рук)
Ts0P  40  50  подставка для ладоней
Ts1P  40  50  подставка для ладоней
Ts0S  42  52  корпус
Ts1S  42  52  корпус
Ts2S  42  52  корпус
